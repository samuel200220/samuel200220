<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1f" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b5de5" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .card-base {
      fill: url(#bgGrad);
      stroke: url(#borderGrad);
      stroke-width: 1.5;
      rx: 12px;
    }
    .project-title {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 20px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }
    .project-desc {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      fill: #a0aec0;
    }
    .badge-bg {
      fill: #1a202c;
      rx: 6px;
      stroke: #2d3748;
      stroke-width: 0.8;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 10px;
      font-weight: 600;
      fill: #9b5de5;
    }
  </style>

  <!-- Card Base -->
  <rect width="420" height="220" class="card-base" />

  <!-- Grid decoration inside card -->
  <path d="M 320 0 L 320 220 M 0 160 L 420 160" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3" />

  <!-- Glowing Abstract Illustration (YowPainter = Palette / Brush / Next.js) -->
  <g transform="translate(330, 35)" opacity="0.85">
    <!-- Palette shape -->
    <path d="M 20 40 C 20 20 40 15 60 25 C 75 35 70 65 50 65 C 45 65 42 60 38 60 C 32 60 30 68 22 60 C 18 55 20 45 20 40 Z" fill="none" stroke="#9b5de5" stroke-width="1.5" />
    <!-- Color dots on palette -->
    <circle cx="35" cy="28" r="4" fill="#00f5d4" filter="url(#glow)" />
    <circle cx="50" cy="32" r="4" fill="#0072ff" />
    <circle cx="58" cy="45" r="4" fill="#9b5de5" />
    <!-- Brush diagonal -->
    <path d="M 15 65 L 45 25" stroke="#00f5d4" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Project Title & Status -->
  <text x="30" y="45" class="project-title">YowPainter Client</text>
  
  <g transform="translate(30, 60)">
    <!-- Status Indicator -->
    <circle cx="5" cy="0" r="4" fill="#9b5de5" />
    <text x="15" y="4" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#718096" letter-spacing="1">FRONTEND / NEXT.JS</text>
  </g>

  <!-- Project Description (Manual Wrapping) -->
  <text x="30" y="90" class="project-desc">
    <tspan x="30" dy="0">Modern web app for booking &amp; managing</tspan>
    <tspan x="30" dy="18">art painters. Digital art gallery</tspan>
    <tspan x="30" dy="18">and artworks management platform.</tspan>
  </text>

  <!-- Tech Badges -->
  <g transform="translate(30, 175)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="65" height="24" class="badge-bg" />
      <text x="32.5" y="15" class="badge-text" text-anchor="middle">Next.js</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(73, 0)">
      <rect width="65" height="24" class="badge-bg" />
      <text x="32.5" y="15" class="badge-text" text-anchor="middle" style="fill: #00f5d4;">React</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(146, 0)">
      <rect width="80" height="24" class="badge-bg" />
      <text x="40" y="15" class="badge-text" text-anchor="middle" style="fill: #0072ff;">TypeScript</text>
    </g>
  </g>
</svg>
