<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1f" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .card-base {
      fill: url(#bgGrad);
      stroke: url(#borderGrad);
      stroke-width: 1.5;
      rx: 12px;
    }
    .project-title {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 20px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }
    .project-desc {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      fill: #a0aec0;
    }
    .badge-bg {
      fill: #1a202c;
      rx: 6px;
      stroke: #2d3748;
      stroke-width: 0.8;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 10px;
      font-weight: 600;
      fill: #00f5d4;
    }
  </style>

  <!-- Card Base -->
  <rect width="420" height="220" class="card-base" />

  <!-- Grid decoration inside card -->
  <path d="M 320 0 L 320 220 M 0 160 L 420 160" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3" />

  <!-- Glowing Abstract Illustration (Mobile / Location Pin / PWA) -->
  <g transform="translate(330, 35)" opacity="0.85">
    <!-- Phone outline -->
    <rect x="20" y="10" width="40" height="70" rx="6" fill="none" stroke="#00f5d4" stroke-width="1.5" />
    <!-- Screen header line -->
    <line x1="20" y1="20" x2="60" y2="20" stroke="#1e293b" stroke-width="1" />
    <!-- Map marker pin glowing inside phone -->
    <path d="M 40 30 C 34 30 30 34 30 40 C 30 47 40 56 40 56 C 40 56 50 47 50 40 C 50 34 46 30 40 30 Z" fill="#0072ff" opacity="0.6" />
    <circle cx="40" cy="38" r="4" fill="#00f5d4" filter="url(#glow)" />
    <!-- Pulsing signal rings -->
    <circle cx="40" cy="38" r="15" fill="none" stroke="#9b5de5" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  <!-- Project Title & Status -->
  <text x="30" y="45" class="project-title">CitizenAlert Client</text>
  
  <g transform="translate(30, 60)">
    <!-- Status Indicator -->
    <circle cx="5" cy="0" r="4" fill="#00f5d4" />
    <text x="15" y="4" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#718096" letter-spacing="1">PWA / NEXT.JS 16</text>
  </g>

  <!-- Project Description (Manual Wrapping) -->
  <text x="30" y="90" class="project-desc">
    <tspan x="30" dy="0">Modern PWA client to map and report</tspan>
    <tspan x="30" dy="18">municipal incidents. Offline mode,</tspan>
    <tspan x="30" dy="18">interactive Leaflet map &amp; AI classification.</tspan>
  </text>

  <!-- Tech Badges -->
  <g transform="translate(30, 175)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="80" height="24" class="badge-bg" />
      <text x="40" y="15" class="badge-text" text-anchor="middle">Next.js 16</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(88, 0)">
      <rect width="65" height="24" class="badge-bg" />
      <text x="32.5" y="15" class="badge-text" text-anchor="middle" style="fill: #0072ff;">React 19</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(161, 0)">
      <rect width="85" height="24" class="badge-bg" />
      <text x="42.5" y="15" class="badge-text" text-anchor="middle" style="fill: #9b5de5;">Tailwind v4</text>
    </g>
  </g>
</svg>
